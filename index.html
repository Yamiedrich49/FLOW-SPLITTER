.goal-head{margin-bottom:8px}
.cup{height:105px;padding:8px 3px 7px;overflow:hidden}
.cup-no{font-size:10px;line-height:12px}
.cup-counts{display:grid;width:100%;grid-template-columns:9px minmax(0,1fr) minmax(0,1fr);column-gap:1px;row-gap:3px;align-items:center;justify-items:center;margin-top:7px}

<body>
<main id="app">
 <div class="header"><div class="wordmark"><span></span>FLOW SPLITTER</div><div class="chapter"><strong id="stage-index">01</strong><span> / 07</span></div><button id="sound" class="sound" aria-label="音のオン・オフ"></button></div>
 <nav id="picker" class="picker" aria-label="問題を選ぶ"></nav>
 <section class="panel" aria-label="ゲーム盤面"><div class="panel-inner">
  <div class="machine-caption"><span class="topic" id="topic">THE FIRST SWITCH</span><span id="machine-info">01 ROTOR</span></div>
  <div class="queue"><div class="queue-label">IN</div><div class="marbles" id="queue"></div><div class="counter" id="counter">0/3</div></div>
  <div class="svgbox"><svg class="machine" id="machine" viewBox="0 0 360 294" preserveAspectRatio="xMidYMid meet" aria-label="玉を左右交互に分ける分岐装置"><g id="wires"></g><g id="terminals"></g><g id="rotors"></g><circle id="moving" class="moving" r="9" cx="180" cy="8" fill="#e58b77"/></svg></div>
  <div class="goal-head"><span>GOAL <b>／ NOW</b></span><em id="goal-hint">印のある出口をそろえる</em></div>
  <div class="cups" id="cups"></div>
  <div class="controls"><button id="step" class="secondary">1球ずつ</button><button id="run" class="primary">流す <span class="arr">→</span></button></div>
  <div class="status"><span id="status" aria-live="polite">矢印をタップして、向きを変えよう。</span><button id="reset" class="reset">↶ 戻す</button></div>
  <div id="feedback" class="feedback"><div><strong>Perfect.</strong><small>すべて一致。</small></div><button id="next">次の問題 →</button></div>
 </div></section>
</main>
<script>
'use strict';
// One rotor toggles once for every marble arriving at it. All goals compare color counts, not arrival order.
const COLORS=['r','b','y'], PALETTE=['#e58b77','#659fc4','#d9b15c'];
const PUZZLES=[
 {name:'THE FIRST SWITCH',n:1,balls:'BBR',initial:'1',targets:{0:'B',1:'BR'}},
 {name:'THREE SWITCHES',n:3,balls:'RBRRB',initial:'101',targets:{0:'R',1:'B',2:'RB',3:'R'}},
 {name:'TWO QUIET CUPS',n:5,balls:'BBBYRYYY',initial:'11011',targets:{0:'R',5:'B'}},
 {name:'THE DISTANT PAIR',n:5,balls:'YYYBYBBRY',initial:'01111',targets:{1:'B',4:'R'}},
 {name:'THREE CLUES',n:5,balls:'RRYRYYBBB',initial:'11110',targets:{0:'B',3:'RYB',5:'Y'}},
 {name:'THE MISSING PATH',n:5,balls:'RRRBRRRYYY',initial:'00101',targets:{1:'R',3:'RR',4:'RY'}},
 {name:'FINAL CURRENT',n:5,balls:'RRYYRBRRRR',initial:'11100',targets:{0:'Y',3:'RRR',4:'R'}}
];
const $=s=>document.querySelector(s);let stage=0,bits=[],live=[],bins=[],cursor=0,playing=false,finished=false,version=0,soundEnabled=true,audio;
try{soundEnabled=localStorage.getItem('flow_splitter_field_sound')!=='off';stage=Math.max(0,Math.min(PUZZLES.length-1,Number(localStorage.getItem('flow_splitter_field_stage')||0)))}catch{}
const point={0:[180,44],1:[104,139],2:[256,139],3:[62,225],4:[298,225]}, exitX={1:[95,265],3:[48,137,223,312],5:[30,87,145,215,273,330]},endY={1:259,3:268,5:281};
function go(n,id,left){if(n===1)return {bin:left?0:1};if(id===0)return {gate:left?1:2};if(n===3)return {bin:id===1?(left?0:1):(left?2:3)};if(id===1)return left?{gate:3}:{bin:2};if(id===2)return left?{bin:3}:{gate:4};return {bin:id===3?(left?0:1):(left?4:5)}}
const bitsFrom=s=>[...s].map(x=>x==='1');
const ballFrom=s=>[...s].map(x=>({R:0,B:1,Y:2})[x]);
const same=(a,b)=>JSON.stringify(a.slice().sort())===JSON.stringify(b.slice().sort());
function simulate(p,initial){const spin=initial.slice(),results=Array.from({length:p.n+1},()=>[]);for(const ball of ballFrom(p.balls)){let id=0;for(;;){const nx=go(p.n,id,spin[id]);spin[id]=!spin[id];if(nx.gate!==undefined)id=nx.gate;else{results[nx.bin].push(ball);break}}}return results}
function finalDirections(p,initial){const spin=initial.slice();for(const ball of ballFrom(p.balls)){let id=0;for(;;){const nx=go(p.n,id,spin[id]);spin[id]=!spin[id];if(nx.gate!==undefined)id=nx.gate;else break}}return spin}
function solved(p,results){return Object.entries(p.targets).every(([id,w])=>same(results[+id],ballFrom(w)))}
function validatePuzzles(){for(const [i,p] of PUZZLES.entries()){let count=0;for(let mask=0;mask<(1<<p.n);mask++){const a=Array.from({length:p.n},(_,j)=>!!(mask&(1<<j)));if(solved(p,simulate(p,a)))count++}if(count!==1||solved(p,simulate(p,bitsFrom(p.initial))))throw Error('Invalid puzzle '+(i+1)+' matches='+count)}}validatePuzzles();
function soundIcon(){return soundEnabled?'<svg viewBox="0 0 24 24"><path d="M10 5 6 9H3v6h3l5 4V5Z"/><path d="M14.5 9.5a4 4 0 0 1 0 5M17.5 6.5a8 8 0 0 1 0 11"/></svg>':'<svg viewBox="0 0 24 24"><path d="M10 5 6 9H3v6h3l5 4V5Z"/><path d="m15 9 6 6m0-6-6 6"/></svg>'}
function playSound(type){if(!soundEnabled)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;function voice(f,dur,delay,amp){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,now+delay);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(amp,now+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);o.connect(g);g.connect(audio.destination);o.start(now+delay);o.stop(now+delay+dur+.02)}if(type==='tap')voice(540,.075,0,.045);if(type==='pass')voice(380,.06,0,.012);if(type==='drop')voice(470,.08,0,.022);if(type==='win'){voice(392,.35,0,.038);voice(494,.35,.075,.035);voice(587,.38,.15,.035);voice(784,.38,.23,.028)}if(type==='no')voice(330,.11,0,.018)}catch{}}
function marker(c,extra=''){return `<span class="marble ${COLORS[c]} ${extra}"></span>`}
function current(){return PUZZLES[stage]}
function selectStage(i){version++;stage=Math.max(0,Math.min(PUZZLES.length-1,i));try{localStorage.setItem('flow_splitter_field_stage',stage)}catch{} bits=bitsFrom(current().initial);clearRun();renderAll()}
function clearRun(){version++;cursor=0;playing=false;finished=false;live=bits.slice();bins=Array.from({length:current().n+1},()=>[]);const moving=$('#moving');if(moving)moving.style.opacity='0'}
function activePath(n){let links=[[[180,7],point[0]]];for(let id=0;id<n;id++)for(const left of [true,false]){const dest=go(n,id,left),end=dest.gate!==undefined?point[dest.gate]:[exitX[n][dest.bin],endY[n]];links.push([point[id],end])}return links}
function renderMachine(){const p=current(),n=p.n;$('#wires').innerHTML=activePath(n).map(([a,b])=>`<path class="track" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`).join('');$('#terminals').innerHTML=exitX[n].map(x=>`<circle class="terminal" cx="${x}" cy="${endY[n]}" r="4"/>`).join('');$('#rotors').innerHTML=Array.from({length:n},(_,id)=>{const [x,y]=point[id];return `<g class="rotor" data-id="${id}" tabindex="0" role="button" aria-label="${id+1}番の分岐を反転"><circle class="gate-outer" cx="${x}" cy="${y}" r="27"/><circle class="gate-core" cx="${x}" cy="${y}" r="22"/><g transform="translate(${x} ${y})"><g class="rotor-arrow" id="arrow-${id}" style="transform:rotate(${live[id]?45:-45}deg)"><path d="M0 -10V10 M-5 5L0 11L5 5"/></g></g><circle class="gate-touch" cx="${x}" cy="${y}" r="32"/></g>`}).join('');$('#rotors').querySelectorAll('.rotor').forEach(el=>{const id=+el.dataset.id;el.addEventListener('click',()=>turn(id));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn(id)}})});$('#machine').classList.toggle('locked',playing||cursor>0)}
function renderQueue(){const p=current();$('#queue').innerHTML=ballFrom(p.balls).map((c,i)=>marker(c,i<cursor?'used':'')).join('');$('#counter').textContent=cursor+'/'+p.balls.length}
function renderCups(){const p=current(),colors=ballFrom(p.balls).includes(2)?[0,1,2]:[0,1];$('#cups').style.setProperty('--cols',p.n+1);$('#cups').innerHTML=Array.from({length:p.n+1},(_,id)=>{const goal=p.targets[id],actual=bins[id],has=goal!==undefined,expected=has?ballFrom(goal):[],correct=has&&cursor===p.balls.length&&same(actual,expected);const rows=colors.map(c=>{const g=has?expected.filter(x=>x===c).length:'–',a=cursor===0?'·':actual.filter(x=>x===c).length;return `<span class="cup-swatch ${COLORS[c]}" aria-hidden="true"></span><span class="cup-number goal-number ${has?'':'is-blank'}">${g}</span><span class="cup-number now-number ${cursor===0?'is-blank':''}">${a}</span>`}).join('');return `<div class="cup ${has?'target':''} ${correct?'correct':''}" aria-label="出口${id+1}${has?'、目標あり':'、指定なし'}"><div class="cup-no">${String(id+1).padStart(2,'0')}</div><div class="cup-counts"><span></span><span class="cup-col-head">G</span><span class="cup-col-head">N</span>${rows}</div></div>`}).join('')}
function paintArrows(){for(let id=0;id<current().n;id++){const el=$(`#arrow-${id}`);if(el)el.style.transform=`rotate(${live[id]?45:-45}deg)`}}
function controls(){const n=current().n;$('#machine').classList.toggle('locked',playing||cursor>0);$('#step').disabled=playing;$('#run').disabled=false;$('#run').innerHTML=playing?'結果へ <span class="arr">→</span>':finished?'もう一度 <span class="arr">→</span>':'流す <span class="arr">→</span>';$('#step').textContent=finished?'最初から1球':'1球ずつ';$('#goal-hint').textContent=n===1?'すべてそろえる':n===3?'すべてそろえる':'色のある出口をそろえる';$('#status').textContent=finished?(solved(current(),bins)?'すべて一致。':'出口が違う。もう一度考えよう。'):cursor>0?'通るたびに、向きが変わる。':'矢印をタップして、流れを決める。';$('#reset').textContent=cursor>0||finished?'↶ 最初に戻す':'↶ 配置を戻す';const win=finished&&solved(current(),bins);$('#feedback').classList.toggle('visible',win);$('#next').textContent=stage===PUZZLES.length-1?'最初の問題へ ↗':'次の問題 →'}
function renderAll(){const p=current();$('#picker').innerHTML=PUZZLES.map((_,i)=>`<button class="stage-btn ${i===stage?'active':''}" aria-label="ステージ${i+1}" data-stage="${i}">${String(i+1).padStart(2,'0')}</button>`).join('');$('#picker').querySelectorAll('button').forEach(b=>b.onclick=()=>{playSound('tap');selectStage(+b.dataset.stage)});$('#topic').textContent=p.name;$('#machine-info').textContent=String(p.n).padStart(2,'0')+' ROTOR'+(p.n>1?'S':'');$('#stage-index').textContent=String(stage+1).padStart(2,'0');$('#sound').innerHTML=soundIcon();renderQueue();renderMachine();renderCups();controls()}
function turn(id){if(playing||cursor>0)return;if(finished)clearRun();bits[id]=!bits[id];live=bits.slice();bins=Array.from({length:current().n+1},()=>[]);finished=false;paintArrows();renderCups();controls();playSound('tap')}
function reset(){const wasInRun=cursor>0||finished||playing;clearRun();if(!wasInRun)bits=bitsFrom(current().initial);live=bits.slice();renderAll();playSound('tap')}
function nextFrame(){return new Promise(r=>requestAnimationFrame(r))}
function animate(from,to,duration,token){return new Promise(resolve=>{const dot=$('#moving');if(!dot||token!==version)return resolve(false);const start=performance.now();function step(t){if(token!==version||!playing)return resolve(false);const f=Math.min(1,(t-start)/duration),ease=f*f*(3-2*f);dot.setAttribute('cx',(from[0]+(to[0]-from[0])*ease).toFixed(2));dot.setAttribute('cy',(from[1]+(to[1]-from[1])*ease).toFixed(2));if(f<1)requestAnimationFrame(step);else resolve(true)}requestAnimationFrame(step)})}
async function rollBall(i,token,fast){const p=current(),c=ballFrom(p.balls)[i],dot=$('#moving');dot.setAttribute('fill',PALETTE[c]);dot.setAttribute('cx',180);dot.setAttribute('cy',7);dot.style.opacity='1';let from=[180,7],id=0;const pace=fast?Math.max(48,77-p.balls.length*2.8):180;if(!await animate(from,point[id],pace,token))return false;
for(;;){const left=live[id],dest=go(p.n,id,left),gateEl=$(`#rotors .rotor[data-id="${id}"]`);live[id]=!live[id];paintArrows();gateEl?.classList.add('pass');setTimeout(()=>gateEl?.classList.remove('pass'),120);playSound('pass');const to=dest.gate!==undefined?point[dest.gate]:[exitX[p.n][dest.bin],endY[p.n]];if(!await animate(point[id],to,pace,token))return false;if(dest.gate!==undefined){id=dest.gate;continue}bins[dest.bin].push(c);cursor++;dot.style.opacity='0';playSound('drop');renderQueue();renderCups();return true}
}
async function run(one=false){if(playing){skip();return}if(finished){clearRun();renderAll()}const p=current(),token=++version;playing=true;controls();const end=one?Math.min(cursor+1,p.balls.length):p.balls.length;for(let i=cursor;i<end;i++){if(!await rollBall(i,token,!one))return;if(token!==version)return}if(token!==version)return;playing=false;if(cursor===p.balls.length){finished=true;paintArrows();if(solved(p,bins))playSound('win');else playSound('no')}controls()}
function skip(){if(!playing)return;version++;playing=false;const p=current();bins=simulate(p,bits);cursor=p.balls.length;finished=true;live=finalDirections(p,bits);$('#moving').style.opacity='0';renderQueue();renderCups();paintArrows();controls();playSound(solved(p,bins)?'win':'drop')}
$('#sound').onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('flow_splitter_field_sound',soundEnabled?'on':'off')}catch{}$('#sound').innerHTML=soundIcon();if(soundEnabled)playSound('tap')};$('#step').onclick=()=>run(true);$('#run').onclick=()=>run(false);$('#reset').onclick=reset;$('#next').onclick=()=>{selectStage(stage===PUZZLES.length-1?0:stage+1);playSound('tap')};selectStage(stage);
</script>
</body>
</html>
